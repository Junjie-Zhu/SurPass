task_prefix: surpass
logging_dir: logs
seed: 42
deterministic: false
epochs: 200
checkpoint_interval: 10
ckpt_dir: null
ema_dir: null
load_model_only: false

ema:
  decay: 0.999
  mutable_param_keywords: [""]

data:
  root_dir: /groups/sbinlab/clschf/datasets
  epoch_size: 30000
  datasets:
    - name: pdb_ppi
      subdir: PDB_PPI
      train_tsv: splits/sources/pdb_ppi.train.tsv
      validation_tsv: splits/sources/pdb_ppi.validation.tsv
      require_labels: true
      weight: 50
    - name: afdb_pos
      subdir: AFDB_DDI
      train_tsv: splits/sources/afdb_pos.train.tsv
      validation_tsv: splits/sources/afdb_pos.validation.tsv
      require_labels: true
      weight: 25
    - name: afdb_neg
      subdir: AFDB_DDI
      train_tsv: splits/sources/afdb_neg.train.tsv
      validation_tsv: splits/sources/afdb_neg.validation.tsv
      require_labels: false
      weight: 25
  batch_size: 2
  num_workers: 16
  pin_memory: true
  distance_bin_start: 2.0
  distance_bin_end: 22.0
  distance_bin_count: 16
  contact_threshold: 8.0
  # One total budget shared by both proteins.
  crop_size: 256
  interface_crop_probability: 1.0

model:
  n_layers: 2
  cross_n_layers: 2
  pair_n_layers: 2
  dim_token: 384
  dim_pair: 96
  n_heads: 8
  dropout: 0.0
  expansion_factor: 2
  plm_in_dim: 2560
  plm_out_dim: 384
  index_emb_dim: 64
  topk_fraction: 0.01
  maximum_topk: 64
  allow_missing_physics: false

loss:
  protein:
    weight: 1.0
  contact:
    weight: 1.0
    gamma: 1.5
    positive_weight: 4.0
    negatives_per_positive: 8.0
  distance:
    weight: 0.1
  aux_protein:
    weight: 0.1

runtime:
  precision: bfloat16

optimizer:
  lr: 0.0005
  weight_decay: 1e-6
  beta1: 0.9
  beta2: 0.999
  use_adamw: true
  lr_scheduler: af3
  warmup_steps: 500
  decay_every_n_steps: 15000
  decay_factor: 0.95
  grad_accum_steps: 1
  max_grad_norm: 0.0

metrics:
  positive_weight: 1.0

wandb:
  enabled: true
  project: surpass
  entity: null
  name: null
  mode: online
  log_interval: 1
  id: null
  resume: allow
  tags: []

hydra:
  run:
    dir: .
  output_subdir: null

