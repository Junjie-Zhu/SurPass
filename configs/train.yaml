task_prefix: surpass
logging_dir: logs
seed: 42
deterministic: false
epochs: 200
checkpoint_interval: 10
ckpt_dir: null
load_model_only: false
recycle_rounds: 1
self_conditioning_probability: 0.5

data:
  root_dir: /lustre/home/acct-clschf/clschf/jjzhu/datasets/ppi_dataset/pdb_metadata
  cluster_tsv_path: /lustre/home/acct-clschf/clschf/jjzhu/datasets/ppi_dataset/pdb_metadata/verified_heterodimers.clustered.tsv
  batch_size: 8
  num_workers: 4
  pin_memory: true
  center_coordinates: true
  random_rotation: true
  test_fraction: 0.2
  negative_ratio: 0
  distance_bin_start: 2.0
  distance_bin_end: 22.0
  distance_bin_count: 64
  contact_threshold: 8.0
  crop_size: 128

model:
  n_layers: 8
  dim_token: 128
  dim_pair: 64
  n_heads: 8
  residual_mha: true
  residual_transition: true
  use_attn_pair_bias: true
  use_qkln: true
  dropout: 0.0
  expansion_factor: 2
  plm_in_dim: 1280
  plm_out_dim: 128
  r_max: 32
  xt_pair_dist_min: 2.0
  xt_pair_dist_max: 22.0
  xt_pair_dist_dim: 64
  dim_opm_inner: 32
  dim_triangle_hidden: 32
  num_classes: 64

loss:
  intra: 0.3
  inter: 0.7
  inter_neg_per_pos: 0
  gaussian_sigma: 0.8
  focal:
    weight: 1.0
    gamma: 1.5
    alpha: 3.0
  mae:
    weight: 0.2
  tversky:
    weight: 1.0
    alpha: 0.7
    beta: 0.3

optimizer:
  lr: 0.0005
  weight_decay: 1e-5
  beta1: 0.9
  beta2: 0.999
  use_adamw: true
  lr_scheduler: af3
  warmup_steps: 500
  decay_every_n_steps: 25000
  decay_factor: 0.95
  grad_accum_steps: 1
  max_grad_norm: 1.0

metrics:
  positive_weight: 1.0

wandb:
  enabled: true
  project: surpass
  entity: null
  name: null
  mode: online
  log_interval: 1
  id: null
  resume: allow
  tags: []

hydra:
  run:
    dir: .
  output_subdir: null
  
performance:
  empty_cache_each_step: false
