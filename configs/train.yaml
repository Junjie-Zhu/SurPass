task_prefix: surpass
logging_dir: logs
seed: 42
deterministic: false
epochs: 200
checkpoint_interval: 10
ckpt_dir: null
ema_dir: null
load_model_only: false

ema:
  decay: 0.999
  mutable_param_keywords: [""]

data:
  root_dir: /groups/sbinlab/clschf/datasets
  epoch_size: 30000
  datasets:
    - name: pdb_ppi
      subdir: PDB_PPI
      cluster_tsv: verified_heterodimers.clustered.tsv
      assemble_negatives: true
      weight: 50
    - name: afdb_pos
      subdir: AFDB_DDI
      cluster_tsv: verified_heterodimers.clustered.tsv
      assemble_negatives: false
      is_positive: true
      weight: 25
    - name: afdb_neg
      subdir: AFDB_DDI
      cluster_tsv: verified_negative_heterodimers.clustered.tsv
      assemble_negatives: false
      is_positive: false
      weight: 25
  batch_size: 2
  num_workers: 16
  pin_memory: true
  test_fraction: 0.15
  negative_ratio: 1
  distance_bin_start: 2.0
  distance_bin_end: 22.0
  distance_bin_count: 64
  contact_threshold: 8.0
  crop_size: 128

model:
  n_layers: 8
  dim_token: 768
  dim_pair: 512
  n_heads: 12
  residual_mha: true
  residual_transition: true
  use_attn_pair_bias: true
  use_qkln: true
  dropout: 0.0
  expansion_factor: 2
  plm_in_dim: 1280
  plm_out_dim: 256
  r_max: 32
  xt_pair_dist_min: 2.0
  xt_pair_dist_max: 22.0
  xt_pair_dist_dim: 64
  num_classes: 64

loss:
  bce:
    weight: 1.0
    pos_weight: 0.1
  tversky:
    weight: 1.0
    alpha: 0.7
    beta: 0.3
    smooth: 1.0e-6

optimizer:
  lr: 0.0005
  weight_decay: 1e-6
  beta1: 0.9
  beta2: 0.999
  use_adamw: true
  lr_scheduler: af3
  warmup_steps: 500
  decay_every_n_steps: 15000
  decay_factor: 0.95
  grad_accum_steps: 4
  max_grad_norm: 1.0

metrics:
  positive_weight: 1.0

wandb:
  enabled: true
  project: surpass
  entity: null
  name: null
  mode: online
  log_interval: 1
  id: null
  resume: allow
  tags: []

hydra:
  run:
    dir: .
  output_subdir: null

