task_prefix: infer
logging_dir: logs
seed: 42
deterministic: false
ckpt_dir: null

data:
  root_dir: /groups/sbinlab/clschf/datasets/PDB_PPI
  test_set_tsv: ${data.root_dir}/test_set.tsv
  fasta_path: ${data.root_dir}/test_set.fasta
  embedding_dir: ${data.root_dir}/test_embeddings
  batch_size: 1
  num_workers: 0
  pin_memory: true
  maximum_length: 2048
  distance_bin_start: 2.0
  distance_bin_end: 22.0
  distance_bin_count: 16
  contact_threshold: 8.0
  ppi_score_threshold: 0.5

metrics:
  positive_weight: 0.01

model:
  n_layers: 2
  cross_n_layers: 2
  pair_n_layers: 2
  dim_token: 384
  dim_pair: 96
  n_heads: 8
  dropout: 0.0
  expansion_factor: 2
  plm_in_dim: 2560
  plm_out_dim: 384
  index_emb_dim: 64
  topk_fraction: 0.01
  maximum_topk: 64
  allow_missing_physics: false

runtime:
  precision: bfloat16

hydra:
  run:
    dir: .
  output_subdir: null
