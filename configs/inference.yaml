task_prefix: infer
logging_dir: logs
seed: 42
deterministic: false
ckpt_dir: null

data:
  root_dir: /groups/sbinlab/clschf/datasets/PDB_PPI
  test_set_tsv: ${data.root_dir}/test_set.tsv
  fasta_path: ${data.root_dir}/test_set.fasta
  embedding_dir: ${data.root_dir}/test_embeddings
  batch_size: 1
  num_workers: 0
  pin_memory: true
  max_full_length: 1024
  distance_bin_start: 2.0
  distance_bin_end: 22.0
  distance_bin_count: 64
  contact_threshold: 8.0
  ppi_score_threshold: 0.5

metrics:
  positive_weight: 0.01

model:
  n_layers: 8
  dim_token: 768
  dim_pair: 512
  n_heads: 12
  residual_mha: true
  residual_transition: true
  use_attn_pair_bias: true
  use_qkln: true
  dropout: 0.0
  expansion_factor: 2
  plm_in_dim: 2560
  plm_out_dim: 512
  r_max: 32
  pair_update_interval: 2
  pair_n_heads: 8
  dim_opm_inner: 128

hydra:
  run:
    dir: .
  output_subdir: null
